name: ci
on:
  push:
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI 独占全量覆盖（deep-standard 法则 4）：--group ci = 门禁 + 单测 + 门禁自证
      - run: pnpm run gates:ci
